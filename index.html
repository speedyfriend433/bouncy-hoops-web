<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Bouncy Basketball Refactored</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiOverlay">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 60</div>
        </div>
         <div id="messageOverlay">
             Game Over!<br><span id="finalScore"></span>
         </div>
    </div>

    <button id="startButton">Start Game</button>
    <button id="restartButton" style="display: none;">Play Again</button>

    <!-- Link to the external JavaScript file (place at the end of body) -->
    <script src="game.js"></script>

</body>
</html>
