<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Bouncy Basketball</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Alice Blue */
            font-family: 'Arial', sans-serif;
            overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
            touch-action: none; /* Prevent default touch actions like scrolling */
        }
        #gameContainer {
            position: relative;
            border: 2px solid #333;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            background-color: #add8e6; /* Light Blue sky */
        }
        canvas {
            display: block;
            background-color: transparent; /* Canvas is transparent over the container */
        }
        #uiOverlay {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 24px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none; /* Allow clicks/taps to go through to the canvas */
        }
         #messageOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff4500; /* Orange Red */
            text-shadow: 2px 2px 4px #000;
            text-align: center;
            pointer-events: none; /* Allow clicks/taps */
            display: none; /* Hidden initially */
         }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff8c00; /* Dark Orange */
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #ff4500; /* Orange Red */
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiOverlay">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 60</div>
        </div>
         <div id="messageOverlay">
             Game Over!<br><span id="finalScore"></span>
         </div>
    </div>

    <button id="startButton">Start Game</button>
    <button id="restartButton" style="display: none;">Play Again</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const messageOverlay = document.getElementById('messageOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');

        // Game Settings
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;
        const GAME_TIME_LIMIT = 60; // seconds

        // Physics Constants
        const GRAVITY = 0.4;
        const PUSH_FORCE = -9; // Negative for upward force
        const HORIZONTAL_DAMPING = 0.99; // Slows down horizontal speed
        const BOUNCE_FACTOR_GROUND = 0.6; // Energy lost on ground bounce
        const BOUNCE_FACTOR_WALL = 0.8;
        const BOUNCE_FACTOR_RIM = 0.75;
        const BOUNCE_FACTOR_BACKBOARD = 0.85;

        // Ball Properties
        let ball = {
            x: GAME_WIDTH / 4,
            y: GAME_HEIGHT / 2,
            radius: 15,
            vx: 5, // Initial horizontal velocity
            vy: 0,
            color: '#ff8c00' // Orange
        };

        // Hoop Properties
        let hoop = {
            x: GAME_WIDTH * 0.75,
            y: GAME_HEIGHT * 0.35,
            width: 80,
            rimThickness: 8,
            rimColor: '#ff4500', // Reddish Orange
            netHeight: 50,
            netColor: '#ffffffaa', // Semi-transparent white
            backboardWidth: 10,
            backboardHeight: 70,
            backboardColor: '#ffffffcc', // Semi-transparent white
            vx: 1.5, // Horizontal speed for moving hoop
            scoreZoneHeight: 10 // A thin line inside the hoop to detect score
        };

        // Game State
        let score = 0;
        let timeLeft = GAME_TIME_LIMIT;
        let timerInterval = null;
        let gameState = 'start'; // 'start', 'playing', 'gameOver'
        let isMouseDown = false;
        let canScore = true; // Prevents multiple scores for one pass
        let hitRim = false; // Used for swish detection

        // --- Initialization ---
        function initGame() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
            gameContainer.style.width = `${GAME_WIDTH}px`;
            gameContainer.style.height = `${GAME_HEIGHT}px`;

            resetGame();
        }

        function resetGame() {
            score = 0;
            timeLeft = GAME_TIME_LIMIT;
            gameState = 'start';
            isMouseDown = false;
            canScore = true;
            hitRim = false;

            ball.x = GAME_WIDTH / 4;
            ball.y = GAME_HEIGHT / 2;
            ball.vx = 5;
            ball.vy = 0;

            hoop.x = GAME_WIDTH * 0.75; // Reset hoop position
            hoop.vx = Math.abs(hoop.vx) * (Math.random() > 0.5 ? 1 : -1); // Randomize initial direction

            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Time: ${timeLeft}`;
            messageOverlay.style.display = 'none';
            startButton.style.display = 'block';
            restartButton.style.display = 'none';
            startButton.disabled = false;

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
             // Reset visual elements if needed
            clearCanvas();
            drawCourt();
            drawHoop();
            drawBall();
        }

        // --- Game Loop ---
        let lastTime = 0;
        function gameLoop(timestamp) {
            if (gameState !== 'playing') {
                 // Allow drawing even when not playing for the start/end screen
                 clearCanvas();
                 drawCourt();
                 drawHoop(); // Keep hoop visible
                 drawBall(); // Keep ball visible
                 if(gameState === 'gameOver') {
                     messageOverlay.style.display = 'block';
                 }
                 requestAnimationFrame(gameLoop); // Keep requesting frames to show static scene
                 return;
            }

            const deltaTime = (timestamp - lastTime) / 16.667; // Normalize to 60 FPS baseline
            lastTime = timestamp;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // --- Update Logic ---
        function update(deltaTime) {
            // Apply Input Force
            if (isMouseDown) {
                ball.vy = PUSH_FORCE;
                // isMouseDown = false; // Uncomment for tap-only, comment for hold-to-float
            }

            // Apply Gravity
            ball.vy += GRAVITY * deltaTime;

            // Update Position
            ball.x += ball.vx * deltaTime;
            ball.y += ball.vy * deltaTime;

            // Apply Horizontal Damping
            ball.vx *= Math.pow(HORIZONTAL_DAMPING, deltaTime); // Apply damping based on deltaTime

            // Update Hoop Position
            hoop.x += hoop.vx * deltaTime;
            if (hoop.x + hoop.width / 2 > GAME_WIDTH || hoop.x - hoop.width / 2 < 0) {
                hoop.vx *= -1; // Bounce hoop off walls
                hoop.x += hoop.vx * deltaTime; // Prevent sticking
            }


            // Collision Detection
            handleCollisions();

            // Scoring Check
            checkScoring();
        }

        // --- Collision Handling ---
        function handleCollisions() {
             hitRim = false; // Reset rim hit for swish detection each frame
            // Ground Collision
            if (ball.y + ball.radius > GAME_HEIGHT) {
                ball.y = GAME_HEIGHT - ball.radius;
                ball.vy *= -BOUNCE_FACTOR_GROUND;
                 ball.vx *= BOUNCE_FACTOR_GROUND; // Damp horizontal on ground hit
                canScore = true; // Allow scoring again after hitting ground
            }

            // Ceiling Collision (less common, but good practice)
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -BOUNCE_FACTOR_WALL; // Use wall bounce factor
                canScore = true;
            }

            // Wall Collisions
            if (ball.x + ball.radius > GAME_WIDTH) {
                ball.x = GAME_WIDTH - ball.radius;
                ball.vx *= -BOUNCE_FACTOR_WALL;
            }
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -BOUNCE_FACTOR_WALL;
            }

            // Hoop Collisions
            const hoopTopY = hoop.y;
            const hoopBottomY = hoop.y + hoop.rimThickness;
            const hoopLeftRimX = hoop.x - hoop.width / 2;
            const hoopRightRimX = hoop.x + hoop.width / 2;
            const backboardLeftX = hoopRightRimX;
            const backboardRightX = backboardLeftX + hoop.backboardWidth;
            const backboardTopY = hoop.y - hoop.backboardHeight / 2 + hoop.rimThickness / 2;
            const backboardBottomY = hoop.y + hoop.backboardHeight / 2 + hoop.rimThickness / 2;

            // 1. Backboard Collision (Simple Rectangle Check)
            if (ball.x + ball.radius > backboardLeftX &&
                ball.x - ball.radius < backboardRightX &&
                ball.y > backboardTopY &&
                ball.y < backboardBottomY) {
                // Check which side it hit more closely
                 if (ball.x < backboardRightX && ball.vx > 0) { // Hit from left
                      ball.x = backboardLeftX - ball.radius;
                      ball.vx *= -BOUNCE_FACTOR_BACKBOARD;
                      hitRim = true; // Count backboard as rim hit for swish
                 }
                 // Add collision from top/bottom if needed, but less common
            }


            // 2. Rim Collision (Simplified: treat as horizontal lines/points)
            const checkRimCollision = (rimX) => {
                // Check intersection with the vertical plane of the rim edge
                if (Math.abs(ball.x - rimX) < ball.radius + hoop.rimThickness / 2) {
                    // Check if ball is vertically aligned with the rim
                    if (ball.y > hoopTopY - ball.radius && ball.y < hoopBottomY + ball.radius) {
                        // More precise check: distance from center to rim corner point
                        const distSq = (ball.x - rimX)**2 + (ball.y - (hoopTopY + hoop.rimThickness / 2))**2;
                        const radiiSq = (ball.radius)**2; // Treat rim corner as point

                        if (distSq < radiiSq * 1.5) { // Allow slightly wider collision check
                             hitRim = true; // It hit the rim
                             canScore = true; // Allow scoring chance after rim bounce

                            // Simple vertical bounce reaction
                             if (ball.y < hoopTopY + hoop.rimThickness / 2) { // Hit from top
                                 ball.vy *= -BOUNCE_FACTOR_RIM;
                                 ball.y = hoopTopY - ball.radius; // Reposition slightly above
                             } else { // Hit from side/below (less likely needed physics)
                                 ball.vx *= -BOUNCE_FACTOR_RIM * 0.8; // Also affect horizontal slightly
                                 // Push ball slightly away horizontally based on which rim
                                 ball.x += (ball.x > hoop.x ? 1 : -1) * 2;
                                 // Add slight upward nudge if hit from below rim
                                 if(ball.vy > 0) ball.vy *= -0.2;
                             }
                             // Prevent sticking
                             ball.vy += (Math.random() - 0.5) * 2; // Tiny random nudge
                             return true; // Collision happened
                        }
                    }
                }
                return false; // No collision
            };

            checkRimCollision(hoopLeftRimX);
            checkRimCollision(hoopRightRimX);

        }

        // --- Scoring Logic ---
        function checkScoring() {
            const hoopTopY = hoop.y;
            const hoopBottomY = hoop.y + hoop.scoreZoneHeight; // Use thin score zone
            const hoopLeftRimX = hoop.x - hoop.width / 2;
            const hoopRightRimX = hoop.x + hoop.width / 2;

            // Condition: Ball must be moving downwards (vy > 0)
            // Condition: Ball's center must cross the hoop's score zone line
            // Condition: Ball must be within the horizontal bounds of the hoop
            // Condition: Scoring must be enabled (canScore flag)

            if (canScore && ball.vy > 0 &&
                ball.y - ball.radius < hoopBottomY && // Check top edge hasn't passed bottom zone yet
                ball.y + ball.radius > hoopTopY && // Check bottom edge has passed top of rim
                ball.x > hoopLeftRimX && ball.x < hoopRightRimX)
            {
                 // Check if ball's center passed the critical scoring line (top of rim) in this frame
                 const prevY = ball.y - ball.vy; // Approximate previous position
                 if (prevY <= hoopTopY + hoop.rimThickness / 2) {
                     score += hitRim ? 2 : 3; // 3 points for a "swish" (no rim/backboard hit)
                     scoreDisplay.textContent = `Score: ${score}`;
                     canScore = false; // Prevent scoring again until ball goes way above or hits ground
                     // Add visual/audio feedback here later (e.g., net animation, sound)
                     console.log(hitRim ? "Score! (2 points)" : "Swish! (3 points)");
                 }
            }

            // Reset canScore if the ball goes significantly above the hoop
            if (!canScore && ball.y < hoop.y - 100) {
                 canScore = true;
            }
        }


        // --- Drawing ---
        function clearCanvas() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        }

        function drawCourt() {
            // Simple gradient background within the container is handled by CSS
            // Optional: Draw court lines if desired
            ctx.fillStyle = '#d2b48c'; // Tan color for a potential court area
            ctx.fillRect(0, GAME_HEIGHT - 20, GAME_WIDTH, 20); // Floor/Ground
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.strokeStyle = '#000'; // Black outline
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.closePath();

             // Simple basketball lines (optional)
             ctx.beginPath();
             ctx.moveTo(ball.x, ball.y - ball.radius);
             ctx.lineTo(ball.x, ball.y + ball.radius);
             ctx.moveTo(ball.x - ball.radius, ball.y);
             ctx.lineTo(ball.x + ball.radius, ball.y);
             ctx.moveTo(ball.x - ball.radius * 0.7, ball.y - ball.radius * 0.7);
             ctx.bezierCurveTo(
                 ball.x - ball.radius * 0.3, ball.y + ball.radius * 0.1, // Control point 1
                 ball.x + ball.radius * 0.3, ball.y + ball.radius * 0.1, // Control point 2
                 ball.x + ball.radius * 0.7, ball.y - ball.radius * 0.7  // End point
             );
             ctx.moveTo(ball.x - ball.radius * 0.7, ball.y + ball.radius * 0.7);
              ctx.bezierCurveTo(
                 ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.1, // Control point 1
                 ball.x + ball.radius * 0.3, ball.y - ball.radius * 0.1, // Control point 2
                 ball.x + ball.radius * 0.7, ball.y + ball.radius * 0.7  // End point
             );
             ctx.strokeStyle = '#00000088'; // Dark semi-transparent lines
             ctx.lineWidth = 1;
             ctx.stroke();
             ctx.closePath();
        }

        function drawHoop() {
            const hoopTopY = hoop.y;
            const hoopBottomY = hoop.y + hoop.rimThickness;
            const hoopLeftRimX = hoop.x - hoop.width / 2;
            const hoopRightRimX = hoop.x + hoop.width / 2;

            // Backboard
            const backboardLeftX = hoopRightRimX;
            const backboardTopY = hoop.y - hoop.backboardHeight / 2 + hoop.rimThickness / 2;
             ctx.fillStyle = hoop.backboardColor;
             ctx.fillRect(backboardLeftX, backboardTopY, hoop.backboardWidth, hoop.backboardHeight);
             ctx.strokeStyle = '#999'; // Outline for backboard
             ctx.strokeRect(backboardLeftX, backboardTopY, hoop.backboardWidth, hoop.backboardHeight);


            // Net (drawn behind rim)
            ctx.beginPath();
            ctx.moveTo(hoopLeftRimX, hoopBottomY);
            ctx.lineTo(hoopLeftRimX + hoop.width * 0.2, hoopBottomY + hoop.netHeight);
            ctx.lineTo(hoopRightRimX - hoop.width * 0.2, hoopBottomY + hoop.netHeight);
            ctx.lineTo(hoopRightRimX, hoopBottomY);
            ctx.strokeStyle = hoop.netColor;
            ctx.lineWidth = 2;
            ctx.stroke();
             // Add a few vertical net lines
             for(let i=0.2; i<0.8; i+=0.2) {
                 ctx.moveTo(hoopLeftRimX + hoop.width * i, hoopBottomY);
                 ctx.lineTo(hoopLeftRimX + hoop.width * 0.2 + (hoop.width*0.6 * i) , hoopBottomY + hoop.netHeight);
                 ctx.stroke();
             }


            // Rim (drawn on top)
            ctx.fillStyle = hoop.rimColor;
            ctx.fillRect(hoopLeftRimX - hoop.rimThickness / 2, hoopTopY, hoop.width + hoop.rimThickness, hoop.rimThickness);
             ctx.strokeStyle = '#a00'; // Darker outline for rim
             ctx.lineWidth = 1;
             ctx.strokeRect(hoopLeftRimX - hoop.rimThickness / 2, hoopTopY, hoop.width + hoop.rimThickness, hoop.rimThickness);


            // Optional: Draw score zone for debugging
            // ctx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            // ctx.lineWidth = 1;
            // ctx.strokeRect(hoopLeftRimX, hoopTopY, hoop.width, hoop.scoreZoneHeight);
        }


        function draw() {
            clearCanvas();
            drawCourt();
            drawHoop();
            drawBall();
            // UI elements (score/timer) are HTML overlays, no need to draw here
        }

        // --- Timer ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval); // Clear any existing timer

            timeLeft = GAME_TIME_LIMIT;
            timerDisplay.textContent = `Time: ${timeLeft}`;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Time: ${timeLeft}`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // --- Game State Control ---
        function startGame() {
            if (gameState === 'playing') return;
            gameState = 'playing';
            startButton.style.display = 'none';
            startButton.disabled = true;
            restartButton.style.display = 'none';
            messageOverlay.style.display = 'none';
            canScore = true; // Ensure scoring is enabled at start

            startTimer();
            lastTime = performance.now(); // Initialize lastTime for deltaTime calculation
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameOver';
            clearInterval(timerInterval);
            timerInterval = null;
            finalScoreDisplay.textContent = `Final Score: ${score}`;
            messageOverlay.style.display = 'block';
            restartButton.style.display = 'block';
            // Ball might continue moving based on current physics until loop stops updating
        }

        // --- Event Listeners ---
        function handleInteractionStart(event) {
            event.preventDefault(); // Prevent default behaviors like text selection or zoom
            if (gameState === 'playing') {
                 isMouseDown = true;
             } else if (gameState === 'start') {
                 // Allow clicking anywhere to start if desired, or rely on button
                 // startGame();
            }
        }

        function handleInteractionEnd(event) {
             event.preventDefault();
             isMouseDown = false;
        }

        // Use both mouse and touch events
        canvas.addEventListener('mousedown', handleInteractionStart);
        canvas.addEventListener('mouseup', handleInteractionEnd);
        canvas.addEventListener('mouseleave', handleInteractionEnd); // Stop pushing if mouse leaves canvas

        canvas.addEventListener('touchstart', handleInteractionStart, { passive: false }); // passive: false to allow preventDefault
        canvas.addEventListener('touchend', handleInteractionEnd);
        canvas.addEventListener('touchcancel', handleInteractionEnd);


        startButton.addEventListener('click', () => {
            resetGame(); // Ensure clean state before starting
            startGame();
        });

        restartButton.addEventListener('click', () => {
             resetGame();
             startGame();
        });

        // --- Initial Setup ---
        initGame();

    </script>

</body>
</html>
